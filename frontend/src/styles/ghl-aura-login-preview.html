<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>GHL AURA | Sign in preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: Manrope, "Segoe UI", sans-serif;
      color: #0b2559;
      background: #f3f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-optical-sizing: auto;
      font-weight: 400;
      --navy: #0b2559;
      --blue: #123a8f;
      --royal: #3b63c4;
      --platinum: #8fa2c4;
      --muted: #71809a;
      --line: #dce4f2;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      background: #f5f7fc;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      place-items: center;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 51% 48%, rgba(255,255,255,.96) 0%, rgba(248,250,254,.8) 32%, transparent 63%),
        linear-gradient(135deg, #fbfcfe 0%, #f0f4fa 51%, #eaf0f9 100%);
    }

    .scene::before {
      position: absolute;
      z-index: -3;
      inset: 0;
      background-image: radial-gradient(rgba(11,37,89,.2) .75px, transparent .9px);
      background-size: 28px 28px;
      content: "";
      opacity: .19;
      mask-image: radial-gradient(ellipse at center, #000 0%, transparent 74%);
    }

    .ambient {
      position: absolute;
      z-index: -2;
      width: min(80vw, 920px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91,127,205,.19), rgba(104,141,213,.075) 35%, transparent 68%);
      filter: blur(8px);
      animation: ambient-breathe 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .orbit {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: min(92vw, 920px);
      aspect-ratio: 1;
      border: 1px solid rgba(79,101,150,.14);
      border-radius: 50%;
      animation: orbit-drift 42s linear infinite;
      pointer-events: none;
    }

    .orbit--inner {
      width: min(72vw, 700px);
      border-style: dashed;
      border-color: rgba(59,99,196,.18);
      animation-direction: reverse;
      animation-duration: 56s;
    }

    .orbit--outer {
      width: min(108vw, 1120px);
      border-color: rgba(143,162,196,.13);
      animation-duration: 68s;
    }

    .orbit::before,
    .orbit::after {
      position: absolute;
      top: 50%;
      left: -5px;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(59,99,196,.75);
      border-radius: 50%;
      background: #f7f9fd;
      box-shadow: 0 0 18px rgba(59,99,196,.22);
      content: "";
    }

    .orbit::after {
      top: auto;
      right: 18%;
      bottom: 4%;
      left: auto;
      width: 7px;
      height: 7px;
      border: 0;
      background: #9aadd3;
      animation: dot-pulse 3s ease-in-out infinite;
    }

    .topbar {
      position: absolute;
      z-index: 2;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px clamp(22px, 5vw, 66px);
      animation: enter-down .8s var(--ease) both;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(143,162,196,.62);
      border-radius: 14px;
      background: linear-gradient(145deg, #0b2559, #123a8f);
      box-shadow: 0 8px 22px rgba(11,37,89,.18), inset 0 1px 0 rgba(255,255,255,.28);
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    .brand-copy { display: grid; gap: 2px; }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: .09em; }
    .brand-sub { color: #71809a; font-size: 9px; font-weight: 700; letter-spacing: .19em; }

    .help-link {
      display: inline-flex;
      height: 40px;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid rgba(143,162,196,.48);
      border-radius: 12px;
      background: rgba(255,255,255,.56);
      color: #344766;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }

    .help-link:hover { transform: translateY(-1px); background: white; }
    .help-icon { display: grid; width: 17px; height: 17px; place-items: center; border-radius: 50%; background: #eaf0f9; color: var(--blue); }

    .login-card {
      position: relative;
      width: min(440px, calc(100vw - 34px));
      margin-top: 12px;
      padding: 33px 40px 29px;
      overflow: hidden;
      border: 1px solid rgba(143,162,196,.52);
      border-radius: 26px;
      background: rgba(255,255,255,.77);
      box-shadow: 0 2px 5px rgba(11,37,89,.035), 0 32px 82px rgba(11,37,89,.17), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(24px);
      animation: card-enter .9s var(--ease) .08s both;
      transform-style: preserve-3d;
      transition: box-shadow .35s var(--ease), transform .2s ease-out;
    }

    .login-card::before {
      position: absolute;
      top: 0;
      right: 12%;
      left: 12%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #8fa2c4 23%, #3b63c4 50%, #8fa2c4 77%, transparent);
      content: "";
    }

    .login-card::after {
      position: absolute;
      top: -150px;
      right: -190px;
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(107,143,224,.12), transparent 70%);
      content: "";
      pointer-events: none;
    }

    .card-content { position: relative; z-index: 1; }

    .login-symbol {
      position: relative;
      display: grid;
      width: 53px;
      height: 53px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid #dce4f2;
      border-radius: 17px;
      background: linear-gradient(145deg, #fff, #edf2fa);
      box-shadow: 0 7px 20px rgba(11,37,89,.07);
    }

    .login-symbol::before,
    .login-symbol::after {
      position: absolute;
      width: 22px;
      height: 14px;
      border: 2px solid var(--blue);
      border-right-color: transparent;
      border-radius: 50%;
      content: "";
      transform: rotate(-32deg);
    }
    .login-symbol::after { border-color: #6b8fe0; border-left-color: transparent; transform: rotate(148deg); }
    .login-symbol i { width: 6px; height: 6px; border-radius: 50%; background: var(--royal); box-shadow: 0 0 10px rgba(59,99,196,.5); }

    .eyebrow {
      margin: 0;
      color: #52627d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .19em;
      text-align: center;
    }

    h1 {
      margin: 6px 0 5px;
      color: var(--navy);
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 48px;
      font-weight: 400;
      letter-spacing: -.035em;
      line-height: 1.08;
      text-align: center;
    }

    .intro {
      margin: 0 0 23px;
      color: #71809a;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .field { margin-top: 15px; }
    .field-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }

    label { color: #2d405f; font-size: 11px; font-weight: 700; }

    .text-link {
      color: #315da9;
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
    }
    .text-link:hover { text-decoration: underline; }

    .input-wrap {
      display: flex;
      height: 46px;
      align-items: center;
      gap: 11px;
      padding: 0 13px;
      border: 1px solid #d9e0ec;
      border-radius: 10px;
      background: rgba(251,252,254,.91);
      color: #7b8aa2;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .input-wrap:focus-within { border-color: #5d7ed0; background: #fff; box-shadow: 0 0 0 4px rgba(59,99,196,.12); }
    .input-wrap svg { flex: 0 0 auto; }
    .input-wrap input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: #1c3156; font-size: 12px; }
    .input-wrap input::placeholder { color: #98a4b6; }

    .icon-button {
      display: grid;
      width: 27px;
      height: 30px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #7888a1;
      cursor: pointer;
    }
    .icon-button:hover { background: #eef2f8; color: #315da9; }

    .remember-row { display: flex; align-items: center; gap: 9px; margin: 15px 0 19px; }
    .remember-row input { width: 14px; height: 14px; margin: 0; accent-color: #315da9; }
    .remember-row label { color: #64748b; font-size: 10px; font-weight: 500; cursor: pointer; }

    .submit {
      position: relative;
      display: flex;
      width: 100%;
      height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.19);
      border-radius: 11px;
      background: linear-gradient(110deg, #0b2559, #123a8f 55%, #1a469c);
      box-shadow: 0 8px 18px rgba(18,58,143,.19), inset 0 1px 0 rgba(255,255,255,.16);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s var(--ease), box-shadow .2s;
    }
    .submit::before {
      position: absolute;
      top: 0;
      left: -70%;
      width: 45%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent);
      content: "";
      transform: skewX(-18deg);
      animation: button-sheen 5s ease-in-out 1.4s infinite;
    }
    .submit:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(18,58,143,.25); }
    .submit:active { transform: translateY(0); }
    .submit svg { transition: transform .2s var(--ease); }
    .submit:hover svg { transform: translateX(4px); }

    .security-note { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 17px 0 0; color: #5f6f88; font-size: 10px; }
    .security-icon { display: grid; width: 19px; height: 19px; place-items: center; border-radius: 50%; background: #eaf5f1; color: #23846d; }

    .message { min-height: 0; margin: 0; color: #b13d52; font-size: 11px; text-align: center; }
    .message:not(:empty) { margin-top: 10px; }
    .message.success { color: #24745f; }

    .footnote {
      position: absolute;
      right: 20px;
      bottom: 21px;
      left: 20px;
      color: #53627b;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      animation: enter-up .7s var(--ease) .35s both;
    }
    .footnote p { margin: 4px 0; }
    .footnote .contact { color: #8290a7; font-size: 10px; font-weight: 400; }
    .footnote a { color: #315da9; font-weight: 700; text-decoration: none; }
    .footnote a:hover { text-decoration: underline; }

    :focus-visible { outline: 3px solid #6b8fe0; outline-offset: 3px; }

    @keyframes card-enter {
      from { opacity: 0; transform: translateY(24px) scale(.975); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes enter-up { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes enter-down { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes orbit-drift { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes ambient-breathe { to { transform: scale(1.12); opacity: .7; } }
    @keyframes dot-pulse { 50% { opacity: .35; transform: scale(.75); } }
    @keyframes button-sheen { 0%, 24% { left: -70%; } 58%, 100% { left: 130%; } }

    @media (max-width: 600px) {
      body { overflow: auto; }
      .scene { min-height: 100svh; padding: 94px 0 83px; }
      .topbar { padding: 18px 18px; }
      .brand-mark { width: 39px; height: 39px; border-radius: 12px; }
      .brand-name { font-size: 13px; }
      .brand-sub { font-size: 8px; }
      .help-link { height: 36px; padding: 0 11px; }
      .login-card { margin: auto 0; padding: 27px 25px 23px; border-radius: 22px; }
      .login-symbol { width: 47px; height: 47px; margin-bottom: 14px; }
      h1 { font-size: 43px; }
      .intro { margin-bottom: 19px; }
      .orbit--outer { width: 145vw; }
      .orbit { width: 118vw; }
      .orbit--inner { width: 90vw; }
      .footnote { bottom: 13px; font-size: 10px; }
    }

    @media (max-height: 700px) and (min-width: 601px) {
      .login-card { padding-top: 23px; padding-bottom: 20px; }
      .login-symbol { width: 43px; height: 43px; margin-bottom: 10px; }
      h1 { font-size: 42px; }
      .intro { margin-bottom: 15px; }
      .field { margin-top: 11px; }
      .input-wrap { height: 42px; }
      .remember-row { margin: 11px 0 14px; }
      .submit { height: 44px; }
      .security-note { margin-top: 12px; }
      .footnote { bottom: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .login-card { transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="ambient" aria-hidden="true"></div>
    <div class="orbit orbit--outer" aria-hidden="true"></div>
    <div class="orbit" aria-hidden="true"></div>
    <div class="orbit orbit--inner" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="GHL AURA home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-copy">
          <span class="brand-name">GHL AURA</span>
          <span class="brand-sub">INDIA VENTURES</span>
        </span>
      </a>
      <a class="help-link" href="mailto:support@ghlaura.com">
        <span class="help-icon" aria-hidden="true">?</span>
        Help
      </a>
    </header>

    <section class="login-card" aria-labelledby="login-title">
      <div class="card-content">
        <div class="login-symbol" aria-hidden="true"><i></i></div>
        <p class="eyebrow">WELCOME BACK</p>
        <h1 id="login-title">Sign in</h1>
        <p class="intro">We’ll take you straight to your workspace.</p>

        <form id="login-form">
          <div class="field">
            <div class="field-heading"><label for="email">Work email</label></div>
            <div class="input-wrap">
              <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/></svg>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required>
            </div>
          </div>

          <div class="field">
            <div class="field-heading">
              <label for="password">Password</label>
              <a class="text-link" href="#forgot-password" id="forgot-link">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="10" width="15" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/><path d="M12 14v2"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="icon-button" id="toggle-password" type="button" aria-label="Show password" title="Show password">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              </button>
            </div>
          </div>

          <div class="remember-row">
            <input id="remember" name="remember" type="checkbox">
            <label for="remember">Keep me signed in on this device</label>
          </div>

          <button class="submit" type="submit">
            <span>Sign in</span>
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
          <p class="message" id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="security-note">
          <span class="security-icon" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="m3.5 8 3 3 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Protected with multi-factor authentication
        </p>
      </div>
    </section>

    <footer class="footnote">
      <p>Calls, follow-ups and pipeline in one calm workspace.</p>
      <p class="contact">Need access? <a href="mailto:admin@ghlaura.com">Contact your administrator</a></p>
    </footer>
  </main>

  <script>
    const password = document.querySelector("#password");
    const toggle = document.querySelector("#toggle-password");
    const message = document.querySelector("#message");

    toggle.addEventListener("click", () => {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      toggle.setAttribute("title", showing ? "Show password" : "Hide password");
      password.focus();
    });

    document.querySelector("#forgot-link").addEventListener("click", (event) => {
      event.preventDefault();
      message.classList.remove("success");
      message.textContent = "Password recovery preview — connect this action to your existing reset flow.";
    });

    document.querySelector("#login-form").addEventListener("submit", (event) => {
      event.preventDefault();
      message.classList.add("success");
      message.textContent = "Design preview only — no sign-in request was sent.";
    });

    const card = document.querySelector(".login-card");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (window.matchMedia("(pointer: fine)").matches && !reducedMotion.matches) {
      document.querySelector(".scene").addEventListener("pointermove", (event) => {
        const bounds = card.getBoundingClientRect();
        const x = (event.clientX - bounds.left - bounds.width / 2) / bounds.width;
        const y = (event.clientY - bounds.top - bounds.height / 2) / bounds.height;
        const overCard = event.clientX >= bounds.left && event.clientX <= bounds.right &&
          event.clientY >= bounds.top && event.clientY <= bounds.bottom;
        card.style.transform = overCard
          ? `perspective(1100px) rotateX(${(-y * 1.6).toFixed(2)}deg) rotateY(${(x * 1.8).toFixed(2)}deg) translateY(-1px)`
          : "";
      });
      document.querySelector(".scene").addEventListener("pointerleave", () => {
        card.style.transform = "";
      });
    }
  </script>
</body>
</html>
