name: API Tests

on:
  pull_request:
    branches:
      - main
      - staging
      - develop
      - backend-api
  push:
    branches:
      - main
      - staging
      - develop
      - backend-api
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      API_TEST_REPORTS: ${{ github.workspace }}/TestResults

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API and test project dependencies
        run: dotnet restore backend.Tests/backend.Tests.csproj

      - name: Build backend in Release
        run: dotnet build backend/backend.csproj --configuration Release --no-restore

      - name: Build API test project in Release
        run: dotnet build backend.Tests/backend.Tests.csproj --configuration Release --no-restore

      - name: Run API integration tests
        run: >
          dotnet test backend.Tests/backend.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=api-tests.trx"
          --results-directory TestResults

      - name: Upload API test results and endpoint inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-${{ github.run_id }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14
