name: Deploy to Production (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    name: 🚀 Deploy to DigitalOcean Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🔐 Connect via SSH & Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting Production Deployment on Droplet..."

            APP_DIR="/var/www/salesapp-production"
            if [ ! -d "$APP_DIR" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R $USER:www-data "$APP_DIR"
            fi
            cd "$APP_DIR"

            # 1. Pull latest code from main
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Repository not yet cloned in $APP_DIR. Please clone the repo first."
              exit 1
            fi

            # 2. Apply Database Migrations
            echo "📊 Applying Database Migrations..."
            dotnet ef database update --project backend/backend.csproj

            # 3. Publish Backend
            echo "⚙️ Publishing .NET Backend..."
            dotnet publish backend/backend.csproj -c Release -o "$APP_DIR/backend_publish"

            # 4. Restart Backend Service
            echo "🔄 Restarting Production Backend Service..."
            sudo systemctl restart salesapp-production-backend.service || sudo systemctl restart salesapp-backend.service

            # 5. Build React Frontend
            echo "🎨 Building React Frontend..."
            cd frontend
            npm install
            npm run build
            cd ..

            # 6. Reload Nginx
            echo "🌐 Reloading Nginx Web Server..."
            sudo systemctl reload nginx

            echo "✅ Production deployment finished successfully!"
