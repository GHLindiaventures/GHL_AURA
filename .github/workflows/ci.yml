name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ main, staging, develop, backend-api ]
  push:
    branches: [ main, staging, develop, backend-api ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: 🛡️ Verify .NET 8 Backend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet Packages
        run: dotnet restore backend/backend.csproj

      - name: 🔨 Build Backend (Check for C# Compiler Errors)
        run: dotnet build backend/backend.csproj --configuration Release --no-restore

  verify-frontend:
    name: 🎨 Verify React 19 Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🧪 Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: 🔨 Compile TypeScript & Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  analyze-backend:
    name: SonarQube Cloud - Backend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔎 Analyze Backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true
          dotnet build backend/backend.csproj --configuration Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  analyze-frontend:
    name: SonarQube Cloud - Frontend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Analyze Frontend
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_FRONTEND_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
