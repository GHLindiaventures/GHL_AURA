name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ main, staging, develop, backend-api ]
  push:
    branches: [ main, staging, develop, backend-api ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: 🛡️ Verify .NET 8 Backend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet Packages
        run: dotnet restore backend/backend.csproj

      - name: 🔨 Build Backend (Check for C# Compiler Errors)
        run: dotnet build backend/backend.csproj --configuration Release --no-restore

  verify-frontend:
    name: 🎨 Verify React 19 Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: 🔨 Compile TypeScript & Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build
