name: ghl-aura

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      UseInMemoryDatabase: "false"
      Database__EnsureCreated: "true"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://127.0.0.1:5173
      Cors__AllowedOrigins__2: http://localhost:5106
      SmtpSettings__Host: ${SMTP_HOST:-smtp.gmail.com}
      SmtpSettings__Port: ${SMTP_PORT:-587}
      SmtpSettings__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      SmtpSettings__SenderName: ${SMTP_SENDER_NAME:-GHL Aura Local}
      SmtpSettings__SenderEmail: ${SMTP_SENDER_EMAIL:-}
      SmtpSettings__Username: ${SMTP_USERNAME:-}
      SmtpSettings__Password: ${SMTP_PASSWORD:-}
      SmtpSettings__ClientBaseUrl: ${SMTP_CLIENT_BASE_URL:-http://localhost:5173}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__ApiKeySid: ${TWILIO_API_KEY_SID:-}
      Twilio__ApiKeySecret: ${TWILIO_API_KEY_SECRET:-}
      Twilio__TwiMLAppSid: ${TWILIO_TWIML_APP_SID:-}
      Twilio__CallerNumber: ${TWILIO_CALLER_NUMBER:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:5106:8080"
    volumes:
      - uploads-data:/workspace/backend/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      VITE_DOCKER: "true"
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/workspace/frontend
      - frontend-node-modules:/workspace/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  uploads-data:
  frontend-node-modules:
